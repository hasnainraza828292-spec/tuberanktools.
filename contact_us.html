<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TubeRank Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">
    <header class="bg-white border-b border-gray-200 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="font-bold text-xl text-gray-900">TubeRank<span class="text-red-600">Tools</span></a>
        <a href="index.html" class="text-sm font-medium text-red-600 hover:underline">Back to Home</a>
    </header>
    <main class="flex-grow max-w-3xl mx-auto px-4 py-12 w-full">
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm space-y-6">
            <h1 class="text-2xl font-bold text-gray-900">Contact Us</h1>
            <p class="text-sm text-gray-600">Have questions, feedback, or feature suggestions? Reach out to our team at support@tuberanktools.example.</p>
            <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been received.');" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Your Name</label>
                    <input type="text" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Email Address</label>
                    <input type="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Message</label>
                    <textarea rows="4" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm"></textarea>
                </div>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-xl text-sm transition">Send Message</button>
            </form>
        </div>
    </main>
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        &copy; 2026 TubeRank Tools. All rights reserved.
    </footer>
</body>
</html>
