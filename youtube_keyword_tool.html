<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Keyword Tool - TubeRank Tools</title>
    <meta name="description" content="Discover relevant long-tail keywords and localized ideas for YouTube SEO.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex flex-col min-h-screen">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-play text-sm"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-gray-900">TubeRank<span class="text-red-600">Tools</span></span>
                </a>
                <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-600">
                    <a href="index.html" class="hover:text-red-600">Home</a>
                    <a href="keyword-tool.html" class="text-red-600 font-semibold">Keyword Tool</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-magnifying-glass-chart"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">YouTube Keyword Ideas Generator</h1>
                    <p class="text-xs text-gray-500">Discover localized keyword ideas and relative demand estimates.</p>
                </div>
            </div>

            <form id="kw-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Seed Keyword</label>
                    <input type="text" id="kw-input" placeholder="e.g. digital marketing, gaming setup" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition shadow-sm">
                    Generate Keyword Ideas
                </button>
            </form>

            <div id="kw-results" class="hidden mt-8 space-y-4 pt-6 border-t border-gray-100">
                <h3 class="font-bold text-gray-900 text-sm">Local Keyword Suggestions</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase">
                                <th class="py-3 px-4">Keyword</th>
                                <th class="py-3 px-4">Source</th>
                                <th class="py-3 px-4">Competition</th>
                                <th class="py-3 px-4 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="kw-table-body"></tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 italic">Note: Data generated locally for planning purposes.</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        &copy; 2026 TubeRank Tools. All rights reserved.
    </footer>
    <script src="script.js"></script>
</body>
</html>
